<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ heading | default('Member Operations Sandbox') }}</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light; font-family: Tahoma, Arial, sans-serif; color: #243648; background: #eef0ed; }
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 14px; line-height: 1.55; }
    h1 { font-family: Georgia, serif; font-size: 28px; font-weight: normal; margin: 0 0 20px; color: #17394b; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    a { color: #174b70; text-underline-offset: 3px; }
    a:hover { color: #082b44; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #cb861b; outline-offset: 3px; }
    button { border: 1px solid #24485a; background: #254f62; color: #fff; padding: 8px 20px; font: bold 13px Tahoma, sans-serif; cursor: pointer; }
    button:hover { background: #183c4e; }
    input, select { font: 14px Tahoma, sans-serif; border: 1px solid #9ca9ae; background: #fff; color: #243648; padding: 8px; min-width: 225px; max-width: 100%; }
    input:focus, select:focus { border-color: #254f62; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; vertical-align: top; padding: 11px 16px; border-bottom: 1px solid #d7dedc; }
    th { width: 34%; font-weight: normal; color: #536369; background: #f1f3ef; }
    td { background: #fffefa; overflow-wrap: anywhere; }
    caption { text-align: left; font-weight: bold; color: #536369; padding-bottom: 10px; }
    fieldset { margin: 24px 0; border: 1px solid #b6c2c4; padding: 22px; background: #fffefa; }
    legend { padding: 0 8px; color: #254f62; font-weight: bold; }
    .workspace { padding: 32px; max-width: 940px; }
    .eyebrow { text-transform: uppercase; letter-spacing: 1.7px; font-size: 10px; font-weight: bold; color: #708080; margin: 0 0 10px; }
    .actions { margin: 22px 0 0; }
    .muted { color: #627176; font-size: 12px; }
    .notice { padding: 18px 22px; border-left: 4px solid #bb852c; background: #fcf5df; }
    .help { margin-top: 36px; background: #f1f3ef; }
    .help button { color: #365364; border-color: #9cacae; background: #e9eeeb; }
    .danger { background: #7d3631; border-color: #632821; }
    .shell-header { background: #183b4c; padding: 23px 30px; border-bottom: 5px solid #b58b4b; }
    .shell-header h1 { color: #fffdf6; margin: 0; font-size: 27px; }
    .shell-header p { color: #c4d0d3; margin: 3px 0 0; font-size: 12px; }
    .shell-layout { height: calc(100vh - 145px); min-height: 590px; table-layout: fixed; }
    .shell-layout td { padding: 0; border: 0; }
    .shell-layout .nav-cell { width: 215px; border-right: 1px solid #b8c4c5; background: #e2e8e4; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    .shell-footer { padding: 10px 30px; font-size: 11px; color: #627176; border-top: 1px solid #c6d0cd; }
    .navigation { padding: 27px 18px; background: #e2e8e4; min-height: 100vh; }
    .navigation h1 { font: bold 11px Tahoma, sans-serif; letter-spacing: 1.4px; text-transform: uppercase; color: #667971; margin-bottom: 20px; }
    .navigation a { display: block; padding: 11px 12px; border: 1px solid #b9c7c1; background: #f6f7f1; font-weight: bold; }
    .navigation p { margin-top: 24px; }
    @media (max-width: 700px) { .shell-layout .nav-cell { width: 150px; } .workspace { padding: 20px; } th, td { padding: 8px; } input, select { min-width: 130px; } }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
